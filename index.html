<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalo para Eve - Galaxia 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .music-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            transition: all 0.3s;
            z-index: 10;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            scale: 1.05;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>Para Eve ✨</h1>
    </div>
    
    <button class="music-btn" id="playBtn">▶ Reproducir Música</button>
    
    <audio id="bgMusic" loop src="musica.mp3"></audio>
    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Estrellas de fondo
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 500;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Marcos con las fotos
        const textureLoader = new THREE.TextureLoader();
        const photos = ['foto1.jpeg', 'foto2.jpeg', 'foto3.jpeg'];
        const photoMeshes = [];

        photos.forEach((photoSrc, index) => {
            textureLoader.load(photoSrc, (texture) => {
                const geometry = new THREE.PlaneGeometry(3, 3);
                const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.x = (index - 1) * 4.5;
                mesh.position.y = Math.sin(index) * 0.5;
                mesh.position.z = -2;
                
                scene.add(mesh);
                photoMeshes.push(mesh);
            });
        });

        camera.position.z = 7;

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            starField.rotation.y += 0.0005;
            
            photoMeshes.forEach((mesh, i) => {
                mesh.rotation.y += 0.005;
                mesh.position.y = Math.sin(Date.now() * 0.001 + i) * 0.3;
            });

            renderer.render(scene, camera);
        }
        animate();

        // Control de Música
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                music.play();
                playBtn.textContent = '⏸ Pausar Música';
            } else {
                music.pause();
                playBtn.textContent = '▶ Reproducir Música';
            }
            isPlaying = !isPlaying;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
