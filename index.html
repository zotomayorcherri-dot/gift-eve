<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Gallery - Para mi amiga Eve</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(35,10,45,0.95) 0%, rgba(5,2,10,0.98) 100%);
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      max-width: 420px;
      width: 90%;
    }
    .card h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 0 0 12px rgba(255,100,200,0.6);
    }
    .card p {
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin: 15px 0 25px 0;
      font-weight: 600;
      color: #ffa3d7;
    }

    .btn-start {
      padding: 14px 40px;
      background: linear-gradient(135deg, #e052a0, #f15c41);
      border: none;
      border-radius: 30px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(224, 82, 160, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(224, 82, 160, 0.9);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Audio con preload="auto" para evitar bloqueos del navegador -->
  <audio id="musicaFondo" loop preload="auto" src="musica.mp3"></audio>

  <div id="start-overlay">
    <div class="card">
      <h1>Galaxy Gallery</h1>
      <div style="font-size: 50px; margin: 10px 0;">🧸💖🐻</div>
      <p>TE QUIERO MUCHOOO MI EVE 🥹❤️‍🩹</p>
      <button class="btn-start" onclick="iniciarExperiencia()">INICIAR</button>
    </div>
  </div>

  <canvas id="webgl"></canvas>

  <script>
    let scene, camera, renderer, controls;
    let galaxyParticles, heartGroup, orbitGroup, tunnelParticles;
    let isTransitioning = false;

    // Cambiamos .jpg por .jpeg
const fotos = ['foto1.jpeg', 'foto2.jpeg', 'foto3.jpeg'];

    function init() {
      const canvas = document.getElementById('webgl');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 50);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enabled = false;

      orbitGroup = new THREE.Group();
      scene.add(orbitGroup);

      crearTunelInicial();
      crearGalaxia();
      crearCorazonYMinicorazones();
      construirGaleriaFinal();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function crearTunelInicial() {
      const count = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 40;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        size: 0.2,
        color: 0xffffff,
        transparent: true,
        opacity: 0.8
      });

      tunnelParticles = new THREE.Points(geometry, material);
      scene.add(tunnelParticles);
    }

    function crearGalaxia() {
      const particleCount = 25000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorInside = new THREE.Color('#ff7db4');
      const colorOutside = new THREE.Color('#6c33ff');

      for (let i = 0; i < particleCount; i++) {
        const radius = Math.random() * 24;
        const spinAngle = radius * 2.2;
        const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

        const randomX = (Math.random() - 0.5) * 0.4 * radius;
        const randomY = (Math.random() - 0.5) * 0.4 * radius;
        const randomZ = (Math.random() - 0.5) * 0.4 * radius;

        const x = Math.cos(branchAngle + spinAngle) * radius + randomX;
        const y = randomY;
        const z = Math.sin(branchAngle + spinAngle) * radius + randomZ;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const mixedColor = colorInside.clone().lerp(colorOutside, radius / 24);
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      galaxyParticles = new THREE.Points(geometry, material);
      galaxyParticles.position.y = -2;
      scene.add(galaxyParticles);
    }

    function crearCorazonYMinicorazones() {
      heartGroup = new THREE.Group();

      const count = 2500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const t = Math.PI * (Math.random() * 2 - 1);
        const x = 16 * Math.pow(Math.sin(t), 3) * 0.25;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.25 + 5;
        const z = (Math.random() - 0.5) * 1.5;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        size: 0.12,
        color: 0xff3399,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      const mainHeart = new THREE.Points(geometry, material);
      heartGroup.add(mainHeart);

      const light = new THREE.PointLight(0xff66cc, 3, 30);
      light.position.set(0, 4, 0);
      heartGroup.add(light);

      scene.add(heartGroup);
    }

    function crearTarjetaTexto(texto) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 160;

      ctx.fillStyle = 'rgba(20, 15, 30, 0.85)';
      if (ctx.roundRect) ctx.roundRect(10, 10, 492, 140, 16); else ctx.fillRect(10, 10, 492, 140);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'Bold 26px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(texto, 256, 80);

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(7, 2.2, 1);
      return sprite;
    }

    function crearMarcoPolaroidConFoto(imgSrc, index) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 300;
      canvas.height = 360;

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(3.8, 4.5, 1);

      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = '#ffffff';
        if (ctx.roundRect) ctx.roundRect(10, 10, 280, 340, 14); else ctx.fillRect(10, 10, 280, 340);
        ctx.fill();

        ctx.drawImage(img, 25, 25, 250, 250);

        ctx.fillStyle = '#e052a0';
        ctx.font = 'Bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('📸 Recuerdo #' + (index + 1), 150, 315);

        texture.needsUpdate = true;
      };
      img.src = imgSrc;

      return sprite;
    }

    function construirGaleriaFinal() {
      const dedicatorias = [
        "Te quiero muchooo mi Eve 🥹❤️‍🩹",
        "Gracias por tu hermosa amistad ✨",
        "Mejores amigos por siempre 🤝",
        "Eres la mejor persona 👑",
        "Contigo siempre en todo 💫",
        "Infinito ♾️"
      ];

      const radius = 14;
      const total = dedicatorias.length;

      dedicatorias.forEach((texto, i) => {
        const angle = (i / total) * Math.PI * 2;
        
        // Tarjetas de texto
        const card = crearTarjetaTexto(texto);
        card.position.set(Math.cos(angle) * radius, Math.sin(i) * 2 + 1, Math.sin(angle) * radius);
        orbitGroup.add(card);

        // Fotos
        const photoSrc = fotos[i % fotos.length];
        const photo = crearMarcoPolaroidConFoto(photoSrc, i);
        const photoAngle = angle + (Math.PI / total);
        
        photo.position.set(Math.cos(photoAngle) * (radius + 2.5), Math.cos(i) * 2, Math.sin(photoAngle) * (radius + 2.5));
        orbitGroup.add(photo);
      });
    }

    // FUNCIÓN DE INICIO CORREGIDA PARA FORZAR AUDIO
    function iniciarExperiencia() {
      const audioElem = document.getElementById('musicaFondo');
      
      if (audioElem) {
        audioElem.currentTime = 0;
        const playPromise = audioElem.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            console.log("Audio reproducido correctamente.");
          }).catch(err => {
            console.log("Reintentando desmutear el audio:", err);
            audioElem.muted = false;
            audioElem.play();
          });
        }
      }

      const overlay = document.getElementById('start-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 800);

      isTransitioning = true;

      gsap.to(camera.position, {
        x: 0,
        y: 18,
        z: 32,
        duration: 3,
        ease: "power2.inOut",
        onComplete: () => {
          controls.enabled = true;
          isTransitioning = false;
          if (tunnelParticles) scene.remove(tunnelParticles);
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (tunnelParticles && isTransitioning) tunnelParticles.rotation.z += 0.02;
      if (galaxyParticles) galaxyParticles.rotation.y += 0.0015;
      if (heartGroup) heartGroup.rotation.y += 0.003;
      if (orbitGroup) orbitGroup.rotation.y += 0.002;

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
